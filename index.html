<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suprime avisos benignos de WebSocket do Vite (HMR propositalmente desativado na plataforma)
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event?.reason?.message || String(event?.reason || '');
        if (msg.toLowerCase().includes('websocket')) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event?.message || '';
        if (typeof msg === 'string' && msg.toLowerCase().includes('websocket')) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
    <title>MeuPC Build - Montador de PC & Compatibilidade</title>
